<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PorqueEUProgramo — Autorização TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.5}
textarea{width:100%;height:90px;font-size:13px}button{font-size:16px;padding:8px 16px;margin-top:8px}</style></head>
<body>
<h1 id="t">Autorização TikTok</h1>
<p id="m"></p>
<textarea id="u" readonly></textarea><br>
<button onclick="navigator.clipboard.writeText(document.getElementById('u').value);this.textContent='Copiado ✔'">Copiar endereço</button>
<p>Esta página não guarda nem envia nada: só mostra o endereço para o copiares para o programa no teu Mac.</p>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('u').value = location.href;
  if (q.get('error')) {
    document.getElementById('t').textContent = 'A autorização falhou';
    document.getElementById('m').textContent = 'Erro: ' + q.get('error') + ' ' + (q.get('error_description') || '');
  } else if (q.get('code')) {
    document.getElementById('t').textContent = 'Autorização recebida ✔';
    document.getElementById('m').textContent = 'Copia o endereço abaixo e cola-o no programa (ou envia-o ao assistente). É válido só durante alguns minutos.';
  } else {
    document.getElementById('m').textContent = 'Página de retorno da autorização do TikTok do PorqueEUProgramo.';
  }
</script>
</body></html>
